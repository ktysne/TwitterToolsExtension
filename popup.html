<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px;
        font-family: -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN",
          "Noto Sans JP", Meiryo, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: #16181c;
        color: #e7e9ea;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        font-weight: 700;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
      }
      .row + .row {
        border-top: 1px solid #23262b;
      }
      .row.sep {
        margin-top: 6px;
        border-top: 1px solid #23262b;
      }
      .label {
        flex: 1;
      }
      .label small {
        display: block;
        color: #71767b;
        font-size: 11px;
        margin-top: 2px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #3a3f44;
        border-radius: 999px;
        transition: 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      input:checked + .slider {
        background: #1d9bf0;
      }
      input:checked + .slider::before {
        transform: translateX(20px);
      }
      .field {
        margin-top: 10px;
      }
      .field > label {
        display: block;
        color: #e7e9ea;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .field > label small {
        color: #71767b;
        font-size: 11px;
        margin-left: 6px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        background: #0c0d0f;
        color: #e7e9ea;
        border: 1px solid #2f3336;
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 12px;
        line-height: 1.4;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #1d9bf0;
      }
      .err {
        color: #f4212e;
        font-size: 11px;
        margin-top: 4px;
        min-height: 1em;
        word-break: break-all;
      }
      .count {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #2f3336;
        color: #71767b;
      }
      .count b {
        color: #e7e9ea;
        font-size: 15px;
      }
      .hint {
        margin-top: 8px;
        color: #71767b;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>TwitterToolsExtension</h1>

    <div class="row">
      <span class="label">
        ブロック/ミュート投稿を非表示
        <small>ブロック/ミュートした相手を検索結果から消す</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span class="label">
        動画の自動再生を止める
        <small>クリックすれば普通に再生</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="disableAutoplay" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span class="label">
        画像/動画に保存ボタンを表示
        <small>原寸画像・最高画質の動画を保存</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="imageSave" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span class="label">
        ワードでミュート
        <small>下のワード/正規表現に一致する投稿を消す</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="wordMute" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="field">
      <label for="muteWords">ミュートするワード<small>部分一致・1行に1つ</small></label>
      <textarea id="muteWords" rows="3" placeholder="ミュートするワードを入力（1行に1つ）"></textarea>
    </div>

    <div class="field">
      <label for="muteRegexes">正規表現<small>1行に1つ・大文字小文字を区別しない</small></label>
      <textarea id="muteRegexes" rows="3" placeholder="正規表現を入力（1行に1つ）"></textarea>
      <div class="err" id="regexError"></div>
    </div>

    <div class="row sep">
      <span class="label">
        @id でミュート
        <small>指定したユーザーの投稿を消す</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="handleMute" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="field">
      <label for="muteHandles">ミュートする @id<small>1行に1つ・@ は省略可</small></label>
      <textarea id="muteHandles" rows="3" placeholder="@id を入力（1行に1つ・@ は省略可）"></textarea>
    </div>

    <div class="count">このタブで除外: <b id="count">0</b> 件</div>
    <div class="hint" id="hint"></div>

    <script src="popup.js"></script>
  </body>
</html>
